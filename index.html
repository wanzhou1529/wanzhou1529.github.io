<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>挽昼个人主页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}

.bg-layer{
    position:fixed;
    inset:0;
    z-index:-1;
    background: linear-gradient(160deg,#0b1022 0%,#192446 40%,#2b3b66 100%);
}
body{
    color:#fff;
    min-height:200vh;
    padding:30px 15px;
}
.glass{
    background:rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:16px;
    box-shadow:0 8px 32px rgba(0,0,0,0.2);
    padding:24px;
    max-width:820px;
    margin:20px auto;
}
.header-card{
    display:flex;
    align-items:center;
    gap:16px;
}
.avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    border:2px solid #ffffff44;
    background:#446;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
}
.info h2{font-size:22px;margin-bottom:6px;}
.info .qq{opacity:0.85;font-size:14px;}
.desc-text{
    text-align:center;
    margin-top:16px;
    padding:12px;
    background:rgba(0,0,0,0.15);
    border-radius:10px;
}
.link-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:20px;
}
.link-item{
    padding:14px;
    background:rgba(255,255,255,0.08);
    border-radius:10px;
    text-align:center;
    cursor:pointer;
    transition:0.2s;
}
.link-item:hover{background:rgba(255,255,255,0.15);}
.audio-card{
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:20px;
}
.audio-avatar{
    width:80px;
    height:80px;
    border-radius:50%;
    background:#446;
}
.audio-buttons button{
    width:44px;height:44px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.2);
    color:white;
    font-size:18px;
    cursor:pointer;
    margin:0 4px;
}
.random-box{
    margin-top:800px;
}
input{
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff;
    padding:10px 12px;
    border-radius:8px;
    font-size:15px;
    margin:6px 4px;
    width:140px;
}
button.gen-btn{
    background:rgba(70,140,255,0.45);
    color:#fff;
    border:1px solid rgba(255,255,255,0.2);
    padding:11px 22px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    margin:8px 4px;
}
#resultBox{
    margin-top:14px;
    padding:14px;
    background:rgba(0,0,0,0.2);
    border-radius:8px;
    min-height:60px;
    word-break:break-all;
}
.footer{
    text-align:center;
    margin-top:30px;
    font-size:13px;
    opacity:0.7;
}
/*点击粒子*/
.particle{
    position:fixed;
    pointer-events:none;
    border-radius:50%;
    z-index:9999;
}
</style>
</head>
<body>
<div class="bg-layer"></div>

<!--背景音乐-->
<audio id="bgMusic" loop preload="auto">
  <!--你可以替换src为自己的音乐链接-->
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">


<div class="glass">
    <div class="header-card">
        <div class="avatar">挽</div>
        <div class="info">
            <h2>挽昼</h2>
            <div class="qq">QQ：3549288409</div>
            <div style="margin-top:4px;opacity:0.7;font-size:14px;">HONOR209</div>
        </div>
    </div>
    <div class="desc-text">编程不是工作，而是创造</div>

    <div class="link-grid">
        <div class="link-item">赞助我们</div>
        <div class="link-item">米酷音乐</div>
        <div class="link-item">晓轩软件库</div>
        <div class="link-item">晓轩云二级域名分发</div>
        <div class="link-item">轩宇云盘</div>
        <div class="link-item">晓轩云IDC</div>
    </div>
</div>

<div class="glass">
    <div class="audio-card">
        <div class="audio-avatar"></div>
        <div>
            <div style="margin-bottom:10px;">背景音乐</div>
            <div class="audio-buttons">
                <button onclick="playMusic()">▶</button>
                <button onclick="pauseMusic()">■</button>
            </div>
        </div>
    </div>
</div>

<div class="glass random-box">
    <h2>🎲 随机数字生成器</h2>
    <div>
        <label>最小值：</label>
        <input type="number" id="minVal" value="1">
        <label>最大值：</label>
        <input type="number" id="maxVal" value="100">
    </div>
    <div>
        <label>生成数量：</label>
        <input type="number" id="countVal" value="5">
        <button class="gen-btn" onclick="genRandom()">生成随机数</button>
    </div>
    <div id="resultBox">结果会在这里显示</div>
</div>

<div class="footer glass">
    备案号：黔ICP202511026号 | 服务商：晓轩网络技术工作室
</div>

<script>
//音乐控制
const audio=document.getElementById("bgMusic");
function playMusic(){audio.play();}
function pauseMusic(){audio.pause();}

//点击粒子特效
document.addEventListener("click",e=>{
    for(let i=0;i<8;i++){
        const p=document.createElement("div");
        p.className="particle";
        const size=Math.random()*8+4;
        p.style.width=size+"px";
        p.style.height=size+"px";
        p.style.left=e.clientX+"px";
        p.style.top=e.clientY+"px";
        p.style.background=`hsl(${Math.random()*360},80%,60%)`;
        document.body.appendChild(p);

        const angle=Math.random()*Math.PI*2;
        const speed=Math.random()*120+60;
        const vx=Math.cos(angle)*speed;
        const vy=Math.sin(angle)*speed;
        let x=e.clientX,y=e.clientY,opacity=1;
        function tick(){
            x+=vx*0.02;
            y+=vy*0.02;
            opacity-=0.025;
            p.style.left=x+"px";
            p.style.top=y+"px";
            p.style.opacity=opacity;
            if(opacity>0){
                requestAnimationFrame(tick);
            }else{
                p.remove();
            }
        }
        tick();
    }
})

//随机数
function genRandom(){
    const min = parseInt(document.getElementById('minVal').value);
    const max = parseInt(document.getElementById('maxVal').value);
    const count = parseInt(document.getElementById('countVal').value);
    const box = document.getElementById('resultBox');

    if(isNaN(min)||isNaN(max)||isNaN(count)){
        box.innerText = "请输入合法数字！";
        return;
    }
    if(min>max){
        box.innerText = "最小值不能大于最大值！";
        return;
    }
    if(count<=0 || count>200){
        box.innerText = "生成数量范围：1‑200";
        return;
    }
    let out = [];
    for(let i=0;i<count;i++){
        const num = Math.floor(Math.random()*(max-min+1)) + min;
        out.push(num);
    }
    box.innerText = out.join("  ");
}
</script>
</body>
</html>
